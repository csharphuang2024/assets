<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>卡通射击闯关</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:auto;background:#000;display:block}
.tbtn{position:fixed;bottom:16px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:26px;display:none;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.5);-webkit-tap-highlight-color:transparent}
.mbtn{position:fixed;top:64px;right:8px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.5);cursor:pointer;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div class="mbtn" id="bm" title="静音 / 取消静音 (M)">🔊</div>
<div class="tbtn" id="bl" style="left:14px">◀</div>
<div class="tbtn" id="br" style="left:96px">▶</div>
<div class="tbtn" id="bj" style="right:96px">⤒</div>
<div class="tbtn" id="bf" style="right:14px;background:rgba(255,80,80,.35)">●</div>
<script>
const CFG = {"assets": ["hero_idle", "hero_shoot", "grunt", "drone", "boss_1", "boss_2", "boss_3", "bg_1", "bg_2", "bg_3"], "sprites": ["hero_idle", "hero_shoot", "grunt", "drone", "boss_1", "boss_2", "boss_3"], "keyInJs": false};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GY = 470;
const IMG = {};
const keys = {}, touch = {l:0, r:0, j:0, f:0};
let mouseDown = false;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const LV = [
  {name:'第 1 关 · 翡翠丛林', bg:'bg_1', boss:'boss_1', kills:8,  bossHp:30, spd:1.0, ground:'#2d5a27', top:'#6fc04a'},
  {name:'第 2 关 · 落日荒漠', bg:'bg_2', boss:'boss_2', kills:11, bossHp:42, spd:1.2, ground:'#7a4a22', top:'#e0a458'},
  {name:'第 3 关 · 熔岩工厂', bg:'bg_3', boss:'boss_3', kills:14, bossHp:55, spd:1.4, ground:'#3a2a3a', top:'#ff6a3d'}
];
const PLAT = [{x:130,y:370,w:200},{x:630,y:370,w:200},{x:380,y:275,w:200}];

/* ---------- 图片加载 / 绿幕处理 ---------- */
function loadImg(n){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = 'image/' + n + '.png';
  });
}
function keyOut(im){
  try{
    const s = Math.min(1, 420 / im.height);
    const w = Math.round(im.width * s), h = Math.round(im.height * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h), p = d.data;
    if (p[3] > 10){   // 左上角不透明 => 还没抠图
      const kr = p[0], kg = p[1], kb = p[2];
      for (let i = 0; i < p.length; i += 4){
        const dr = p[i]-kr, dg = p[i+1]-kg, db = p[i+2]-kb;
        if (dr*dr + dg*dg + db*db < 95*95) p[i+3] = 0;
      }
      x.putImageData(d, 0, 0);
    }
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++){
      if (p[(yy*w+xx)*4+3] > 20){ if (xx<x0)x0=xx; if (xx>x1)x1=xx; if (yy<y0)y0=yy; if (yy>y1)y1=yy; }
    }
    if (x1 < x0) return c;
    const c2 = document.createElement('canvas'); c2.width = x1-x0+1; c2.height = y1-y0+1;
    c2.getContext('2d').drawImage(c, x0, y0, c2.width, c2.height, 0, 0, c2.width, c2.height);
    return c2;
  }catch(e){ return im; }   // file:// 下画布被污染时，直接用原图
}

/* ---------- 工具 ---------- */
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function spr(name, cx, bottom, h, flip){
  const im = IMG[name]; if (!im) return false;
  const w = im.width * h / im.height;
  ctx.save(); ctx.translate(cx, bottom); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w/2, -h, w, h); ctx.restore(); return true;
}
function fallback(kind, cx, b, h, face){
  const col = {hero:'#3b6fd8', g:'#8e44ad', d:'#c0392b', boss:'#e67e22'}[kind] || '#888';
  const w = h * (kind === 'd' ? 1.2 : 0.5);
  ctx.fillStyle = col; ctx.fillRect(cx - w/2, b - h, w, h);
  ctx.fillStyle = '#fff'; ctx.fillRect(cx + face*w*0.15 - 4, b - h*0.8, 8, 8);
}
function outlineText(t, x, y, size, fill){
  ctx.font = 'bold ' + size + 'px sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill || '#fff'; ctx.fillText(t, x, y);
}

/* ---------- 音效 + 背景音乐（Web Audio 实时合成，无需音频文件） ---------- */
const SFX = (() => {
  let ac = null, master, sfxG, musG, noiseBuf, muted = false;
  let want = null, bgmOn = false, theme = null, bpm = 120, intens = 1, step = 0, nextT = 0;
  const last = {};
  const mf = n => 440 * Math.pow(2, (n - 69) / 12);
  const THEMES = [
    {root:45, bpm:128, bass:[0,-1,0,-1,3,-1,3,-1,5,-1,5,-1,3,-1,2,-1],
     a:[12,-1,10,-1,7,-1,10,-1,12,-1,15,-1,14,-1,10,-1], b:[12,-1,14,-1,15,-1,14,-1,12,-1,10,-1,7,-1,5,-1]},
    {root:38, bpm:136, bass:[0,0,-1,0,5,-1,5,-1,7,-1,7,0,3,-1,3,-1],
     a:[12,-1,15,12,17,-1,15,-1,12,-1,10,-1,12,15,-1,-1], b:[17,-1,15,-1,12,-1,10,-1,12,15,17,-1,19,-1,17,-1]},
    {root:42, bpm:148, bass:[0,-1,0,0,-1,0,3,-1,0,-1,0,0,-1,5,-1,3],
     a:[12,12,-1,15,-1,12,-1,10,12,-1,15,-1,18,-1,15,-1], b:[19,-1,18,-1,15,-1,12,-1,15,-1,18,19,-1,22,-1,-1]}
  ];
  function tone(f, dur, type, vol, t, f2, dest){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, t, ftype, f1, f2, dest){
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const flt = ac.createBiquadFilter(); flt.type = ftype; flt.frequency.setValueAtTime(f1, t);
    if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(flt); flt.connect(g); g.connect(dest || sfxG); s.start(t); s.stop(t + dur + 0.02);
  }
  const DEF = {
    shoot:  t => tone(880, 0.09, 'square', 0.22, t, 220),
    eshoot: t => tone(320, 0.12, 'sawtooth', 0.09, t, 140),
    hit:    t => { noise(0.06, 0.25, t, 'highpass', 2000); tone(260, 0.06, 'square', 0.12, t, 120); },
    bhit:   t => { noise(0.08, 0.3, t, 'lowpass', 1500, 400); tone(140, 0.1, 'square', 0.2, t, 70); },
    boom:   t => { noise(0.4, 0.6, t, 'lowpass', 2500, 120); tone(140, 0.35, 'sawtooth', 0.35, t, 35); },
    hurt:   t => { tone(420, 0.3, 'sawtooth', 0.3, t, 70); noise(0.2, 0.3, t, 'bandpass', 800, 300); },
    jump:   t => tone(300, 0.15, 'square', 0.18, t, 720),
    pickup: t => { tone(660, 0.1, 'triangle', 0.35, t); tone(990, 0.18, 'triangle', 0.35, t + 0.08); },
    boss:   t => { for (let i = 0; i < 3; i++){ tone(110, 0.22, 'sawtooth', 0.4, t + i*0.3, 90); tone(165, 0.22, 'square', 0.15, t + i*0.3, 120); } },
    clear:  t => [60,64,67,72,76].forEach((n, i) => tone(mf(n), 0.25, 'square', 0.25, t + i*0.12)),
    over:   t => [64,60,57,52].forEach((n, i) => tone(mf(n), 0.4, 'triangle', 0.4, t + i*0.25, mf(n)*0.97)),
    win:    t => [60,64,67,72,67,72,76,79].forEach((n, i) => tone(mf(n), 0.3, 'square', 0.25, t + i*0.14))
  };
  const GAP = {shoot:0.05, eshoot:0.08, hit:0.04, bhit:0.05};
  function play(n){
    if (!ac || muted) return;
    const now = ac.currentTime;
    if (GAP[n] && last[n] && now - last[n] < GAP[n]) return;
    last[n] = now;
    try{ DEF[n](now); }catch(e){}
  }
  function playStep(s, t){
    const th = theme, b = s % 16, lead = s < 16 ? th.a : th.b, sl = 60 / bpm / 4;
    if (th.bass[b] >= 0) tone(mf(th.root + th.bass[b]), sl * 1.8, 'triangle', 0.55, t, 0, musG);
    if (lead[b] >= 0) tone(mf(th.root + 12 + lead[b] + (intens === 2 ? 12 : 0)), sl * 1.5,
                           intens === 0 ? 'triangle' : 'square', intens === 0 ? 0.2 : 0.16, t, 0, musG);
    if (b % 4 === 0 || (intens === 2 && b % 2 === 0)) tone(150, 0.12, 'sine', 0.7, t, 40, musG);
    if (intens > 0 && b % 2 === 1) noise(0.04, 0.12, t, 'highpass', 6000, 0, musG);
  }
  function sched(){
    if (!ac || !bgmOn || ac.state !== 'running') return;
    if (nextT < ac.currentTime - 0.3) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.2){
      playStep(step, nextT); nextT += 60 / bpm / 4; step = (step + 1) % 32;
    }
  }
  function apply(){
    if (!ac) return;
    if (!want){ bgmOn = false; return; }
    theme = THEMES[want[0]]; intens = want[1];
    bpm = theme.bpm * (intens === 0 ? 0.75 : intens === 2 ? 1.2 : 1);
    step = 0; nextT = ac.currentTime + 0.08; bgmOn = true;
  }
  // mode(关卡序号, 强度)：强度 0=菜单 1=普通 2=Boss；mode(null) 停止音乐
  function mode(i, k){
    const w = i == null ? null : [i, k];
    if ((w && want && w[0] === want[0] && w[1] === want[1]) || (!w && !want)) return;
    want = w; apply();
  }
  function init(){
    if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
      sfxG = ac.createGain(); sfxG.gain.value = 0.6; sfxG.connect(master);
      musG = ac.createGain(); musG.gain.value = 0.28; musG.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      setInterval(sched, 50); apply();
    }catch(e){ ac = null; }
  }
  function toggle(){ muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8; return muted; }
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });
  return {init, play, mode, toggle};
})();

/* ---------- 游戏状态 ---------- */
let state = 'load', lv = 0, score = 0, P, bullets = [], enemies = [], boss = null, drops = [], parts = [];
let kills = 0, spawnT = 0, banner = '', bannerT = 0, shake = 0, tick = 0, clearT = 0;

function newGame(){
  score = 0;
  P = {x:W/2, y:GY, vx:0, vy:0, w:40, h:84, face:1, hp:5, max:5, cd:0, inv:0, on:true};
  startLevel(0);
}
function startLevel(i){
  lv = i; kills = 0; boss = null; bullets = []; enemies = []; drops = []; parts = [];
  spawnT = 60; P.x = W/2; P.y = GY; P.vx = P.vy = 0; P.inv = 90; P.hp = Math.min(P.max, P.hp + 1);
  banner = LV[i].name; bannerT = 130; state = 'play';
}
function advance(){
  if (state === 'menu' || state === 'over' || state === 'win') newGame();
  else if (state === 'clear' && clearT <= 0){ if (lv < LV.length - 1) startLevel(lv + 1); else { state = 'win'; SFX.play('win'); } }
}
function boom(x, y, n, c){
  for (let i = 0; i < n; i++) parts.push({x, y, vx:rnd(-4,4), vy:rnd(-5,3), life:rnd(20,40), c:c || '#ffb300', r:rnd(3,7)});
}
function enemyShoot(x, y, ang, sp){
  SFX.play('eshoot');
  bullets.push({x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, p:0, r:7});
}
function aim(x, y){ return Math.atan2((P.y - 42) - y, P.x - x); }
function hurtPlayer(){
  if (P.inv > 0) return;
  P.hp--; P.inv = 80; shake = 12; boom(P.x, P.y - 40, 12, '#ff5252'); SFX.play('hurt');
  if (P.hp <= 0){ state = 'over'; boom(P.x, P.y - 40, 40, '#ff5252'); SFX.play('over'); }
}
function spawnEnemy(){
  const c = LV[lv], side = Math.random() < 0.5 ? -1 : 1;
  if (Math.random() < 0.35){
    enemies.push({t:'d', x:side<0?-40:W+40, by:rnd(100,230), y:0, w:64, h:50, hp:1, vx:-side*rnd(1.5,2.3)*c.spd, ph:rnd(0,6), cd:rnd(50,110), hit:0, face:-side});
  } else {
    enemies.push({t:'g', x:side<0?-30:W+30, y:GY, w:42, h:84, hp:2, vx:0, cd:rnd(50,110), hit:0, face:-side});
  }
}

/* ---------- 更新 ---------- */
function update(){
  tick++;
  if (state === 'play') SFX.mode(lv, boss ? 2 : 1);
  else if (state === 'menu' || state === 'load') SFX.mode(0, 0);
  else SFX.mode(null);
  if (shake > 0) shake--;
  for (const p of parts){ p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--; }
  parts = parts.filter(p => p.life > 0);
  if (state === 'clear' && clearT > 0) clearT--;
  if (state !== 'play') return;

  const c = LV[lv];
  const L = keys.KeyA || keys.ArrowLeft || touch.l, R = keys.KeyD || keys.ArrowRight || touch.r;
  const J = keys.KeyW || keys.ArrowUp || keys.KeyK || touch.j;
  const F = keys.KeyJ || keys.Space || mouseDown || touch.f;

  P.vx = ((R ? 1 : 0) - (L ? 1 : 0)) * 4.2;
  if (L && !R) P.face = -1; if (R && !L) P.face = 1;
  if (J && P.on){ P.vy = -13.5; P.on = false; SFX.play('jump'); }
  const prevY = P.y;
  P.vy += 0.65; P.x += P.vx; P.y += P.vy;
  P.x = clamp(P.x, P.w/2, W - P.w/2);
  P.on = false;
  if (P.y >= GY){ P.y = GY; P.vy = 0; P.on = true; }
  else if (P.vy >= 0){
    for (const pl of PLAT){
      if (P.x + P.w/3 > pl.x && P.x - P.w/3 < pl.x + pl.w && prevY <= pl.y && P.y >= pl.y){ P.y = pl.y; P.vy = 0; P.on = true; }
    }
  }
  if (P.cd > 0) P.cd--; if (P.inv > 0) P.inv--;
  if (F && P.cd <= 0){
    bullets.push({x:P.x + P.face*30, y:P.y - 54, vx:P.face*11, vy:0, p:1, r:6});
    P.cd = 12; SFX.play('shoot');
  }

  // 刷怪 / Boss
  if (!boss && kills < c.kills){
    spawnT--;
    if (spawnT <= 0 && enemies.length < 3 + lv){ spawnEnemy(); spawnT = rnd(70, 130) / c.spd; }
  } else if (!boss && kills >= c.kills){
    boss = {x:W - 130, y:GY, w:150, h:190, hp:c.bossHp, max:c.bossHp, dir:-1, cd:80, hit:0, face:-1, n:0};
    enemies = []; banner = '⚠ BOSS 出现！'; bannerT = 120; SFX.play('boss');
  }

  // 敌人
  for (const e of enemies){
    if (e.hit > 0) e.hit--;
    if (e.t === 'g'){
      const d = P.x - e.x; e.face = d < 0 ? -1 : 1;
      if (Math.abs(d) > 240) e.x += e.face * 1.3 * c.spd;
      e.cd--;
      if (e.cd <= 0 && Math.abs(d) < 560){ enemyShoot(e.x + e.face*28, e.y - 56, aim(e.x, e.y - 56), 4.5); e.cd = rnd(75, 140) / c.spd; }
    } else {
      e.x += e.vx; e.ph += 0.05; e.y = e.by + Math.sin(e.ph) * 30; e.face = e.vx < 0 ? -1 : 1;
      e.cd--;
      if (e.cd <= 0 && e.x > 0 && e.x < W){ enemyShoot(e.x, e.y, aim(e.x, e.y), 4.2); e.cd = rnd(90, 150) / c.spd; }
      if (e.x < -120 || e.x > W + 120) e.dead = 1;
    }
    if (!e.dead && Math.abs(P.x - e.x) < (P.w + e.w)/2 - 6 && P.y > e.y - e.h && P.y - P.h < e.y) hurtPlayer();
  }

  // Boss
  if (boss){
    boss.hit = Math.max(0, boss.hit - 1);
    boss.x += boss.dir * (1.4 + lv * 0.3);
    if (boss.x < 140){ boss.x = 140; boss.dir = 1; }
    if (boss.x > W - 140){ boss.x = W - 140; boss.dir = -1; }
    boss.face = P.x < boss.x ? -1 : 1;
    boss.cd--;
    if (boss.cd <= 0){
      const bx = boss.x, by = boss.y - 110, a = aim(bx, by);
      const spread = lv >= 1 ? [-0.35, -0.17, 0, 0.17, 0.35] : [-0.25, 0, 0.25];
      for (const s of spread) enemyShoot(bx, by, a + s, 4.8);
      boss.n++; boss.cd = 85 - lv * 12;
      if (lv === 2 && boss.n % 3 === 0){ for (let k = 0; k < 8; k++) enemyShoot(bx, by, k * Math.PI / 4, 3.6); }
    }
    if (Math.abs(P.x - boss.x) < (P.w + boss.w)/2 - 20 && P.y > boss.y - boss.h && P.y - P.h < boss.y) hurtPlayer();
  }

  // 子弹
  for (const b of bullets){
    b.x += b.vx; b.y += b.vy;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20){ b.dead = 1; continue; }
    if (b.p){
      for (const e of enemies){
        if (e.dead) continue;
        if (b.x > e.x - e.w/2 - b.r && b.x < e.x + e.w/2 + b.r && b.y > e.y - e.h - b.r && b.y < e.y + b.r){
          b.dead = 1; e.hp--; e.hit = 6; boom(b.x, b.y, 4); SFX.play('hit');
          if (e.hp <= 0){
            e.dead = 1; kills++; score += e.t === 'g' ? 100 : 80; boom(e.x, e.y - e.h/2, 18); SFX.play('boom');
            if (Math.random() < 0.18) drops.push({x:e.x, y:GY - 14, t:420});
          }
          break;
        }
      }
      if (!b.dead && boss && b.x > boss.x - boss.w/2 && b.x < boss.x + boss.w/2 && b.y > boss.y - boss.h && b.y < boss.y){
        b.dead = 1; boss.hp--; boss.hit = 5; score += 10; boom(b.x, b.y, 3, '#fff176'); SFX.play('bhit');
        if (boss.hp <= 0){
          boom(boss.x, boss.y - 90, 70, '#ff9100'); score += 500 + lv * 200;
          boss = null; bullets = []; state = 'clear'; clearT = 70; shake = 20;
          SFX.play('boom'); SFX.play('clear');
          break;
        }
      }
    } else if (P.inv <= 0 && Math.abs(b.x - P.x) < P.w/2 + b.r - 2 && b.y > P.y - P.h && b.y < P.y){
      b.dead = 1; hurtPlayer();
    }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  // 回血道具
  for (const d of drops){
    d.t--;
    if (Math.abs(P.x - d.x) < 30 && P.y > d.y - 10 && P.y - P.h < d.y + 10){ d.t = 0; P.hp = Math.min(P.max, P.hp + 1); boom(d.x, d.y, 8, '#ff80ab'); SFX.play('pickup'); }
  }
  drops = drops.filter(d => d.t > 0);
  if (bannerT > 0) bannerT--;
}

/* ---------- 绘制 ---------- */
function draw(){
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-4, 4), rnd(-4, 4));
  const c = LV[state === 'load' || state === 'menu' ? 0 : lv];
  const bg = IMG[c.bg];
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  else { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#d6f0ff'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

  // 地面 & 平台
  ctx.fillStyle = c.ground; ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = c.top; ctx.fillRect(0, GY, W, 8);
  for (const pl of PLAT){
    ctx.fillStyle = c.ground; ctx.fillRect(pl.x, pl.y, pl.w, 16);
    ctx.fillStyle = c.top; ctx.fillRect(pl.x, pl.y, pl.w, 6);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 2; ctx.strokeRect(pl.x, pl.y, pl.w, 16);
  }

  if (state !== 'load' && state !== 'menu'){
    for (const d of drops){
      if (d.t < 120 && Math.floor(d.t / 6) % 2) continue;
      outlineText('❤', d.x, d.y - Math.abs(Math.sin(tick / 12)) * 8, 28, '#ff4081');
    }
    for (const e of enemies){
      ctx.globalAlpha = e.hit > 0 ? 0.55 : 1;
      if (e.t === 'g'){ if (!spr('grunt', e.x, e.y, 92, e.face > 0)) fallback('g', e.x, e.y, e.h, e.face); }
      else { if (!spr('drone', e.x, e.y + 8, 62, e.face > 0)) fallback('d', e.x, e.y, e.h, e.face); }
      ctx.globalAlpha = 1;
    }
    if (boss){
      ctx.globalAlpha = boss.hit > 0 ? 0.6 : 1;
      if (!spr(c.boss, boss.x, boss.y, 210, boss.face > 0)) fallback('boss', boss.x, boss.y, boss.h, boss.face);
      ctx.globalAlpha = 1;
    }
    if (P && state !== 'over' && !(P.inv > 0 && Math.floor(P.inv / 4) % 2)){
      const moving = Math.abs(P.vx) > 0.1 && P.on;
      ctx.save();
      ctx.translate(P.x, P.y); if (moving) ctx.rotate(Math.sin(tick / 3) * 0.06); ctx.translate(-P.x, -P.y);
      const name = (P.cd > 6 && IMG.hero_shoot) ? 'hero_shoot' : 'hero_idle';
      if (!spr(name, P.x, P.y, 96, P.face < 0)) fallback('hero', P.x, P.y, P.h, P.face);
      ctx.restore();
    }
    for (const b of bullets){
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7);
      ctx.fillStyle = b.p ? '#ffeb3b' : '#ff5252'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = b.p ? '#ff9800' : '#7f0000'; ctx.stroke();
    }
    for (const p of parts){ ctx.globalAlpha = clamp(p.life / 30, 0, 1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    drawHUD(c);
  }
  ctx.restore();
  drawOverlay();
}
function drawHUD(c){
  ctx.textAlign = 'left'; ctx.font = 'bold 26px sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = '#000';
  const hp = '❤'.repeat(Math.max(0, P.hp)) + '♡'.repeat(Math.max(0, P.max - P.hp));
  ctx.strokeText(hp, 16, 36); ctx.fillStyle = '#ff4081'; ctx.fillText(hp, 16, 36);
  ctx.textAlign = 'right';
  ctx.strokeText('得分 ' + score, W - 16, 36); ctx.fillStyle = '#fff'; ctx.fillText('得分 ' + score, W - 16, 36);
  ctx.textAlign = 'center'; ctx.font = 'bold 20px sans-serif';
  const info = boss ? c.name : c.name + '   击败 ' + Math.min(kills, c.kills) + ' / ' + c.kills;
  ctx.strokeText(info, W/2, 30); ctx.fillStyle = '#fff'; ctx.fillText(info, W/2, 30);
  if (boss){
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(W/2 - 200, 44, 400, 16);
    ctx.fillStyle = '#e53935'; ctx.fillRect(W/2 - 198, 46, 396 * boss.hp / boss.max, 12);
  }
  if (bannerT > 0){ ctx.globalAlpha = clamp(bannerT / 40, 0, 1); outlineText(banner, W/2, 180, 44, '#ffee58'); ctx.globalAlpha = 1; }
}
function drawOverlay(){
  let t1 = '', t2 = '', t3 = '';
  if (state === 'load'){ t1 = '加载中…'; }
  else if (state === 'menu'){
    t1 = '卡通射击闯关'; t2 = '点击屏幕 / 按 Enter 开始';
    t3 = isTouch ? '左下 ◀ ▶ 移动，⤒ 跳跃，● 开火' : 'A/D 或 ←/→ 移动 · W/↑/K 跳跃 · J/空格/鼠标左键 开火 · M 静音';
  } else if (state === 'clear'){
    t1 = '过关！'; t2 = clearT > 0 ? '' : '点击屏幕 / 按 Enter 进入下一关'; t3 = '得分 ' + score;
  } else if (state === 'over'){ t1 = '游戏结束'; t2 = '点击屏幕 / 按 Enter 重新开始'; t3 = '得分 ' + score; }
  else if (state === 'win'){ t1 = '🎉 通关成功！'; t2 = '点击屏幕 / 按 Enter 再玩一次'; t3 = '最终得分 ' + score; }
  if (!t1) return;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
  outlineText(t1, W/2, 220, 60, '#ffee58');
  if (t2) outlineText(t2, W/2, 290, 28, '#fff');
  if (t3) outlineText(t3, W/2, 340, 22, '#b3e5fc');
}

/* ---------- 输入 ---------- */
addEventListener('keydown', e => {
  keys[e.code] = true;
  SFX.init();
  if (e.code === 'KeyM') setMuteIcon(SFX.toggle());
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') advance();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('pointerdown', () => SFX.init());   // 浏览器要求用户操作后才能出声
const muteBtn = document.getElementById('bm');
function setMuteIcon(m){ muteBtn.textContent = m ? '🔇' : '🔊'; }
muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); SFX.init(); setMuteIcon(SFX.toggle()); });
cv.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') mouseDown = true; advance(); });
addEventListener('pointerup', () => { mouseDown = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
[['bl','l'],['br','r'],['bj','j'],['bf','f']].forEach(([id, k]) => {
  const el = document.getElementById(id);
  if (isTouch) el.style.display = 'flex';
  el.addEventListener('pointerdown', e => { e.preventDefault(); touch[k] = 1; advance(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, () => { touch[k] = 0; }));
});

/* ---------- 启动 ---------- */
let last = 0, acc = 0;
function loop(t){
  acc += Math.min(100, t - last); last = t;
  while (acc >= 16.67){ update(); acc -= 16.67; }
  draw(); requestAnimationFrame(loop);
}
(async () => {
  for (const n of CFG.assets){
    let im = await loadImg(n);
    if (im && CFG.keyInJs && CFG.sprites.includes(n)) im = keyOut(im);
    IMG[n] = im;
  }
  state = 'menu';
})();
requestAnimationFrame(loop);
</script>
